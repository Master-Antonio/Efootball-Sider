; ==============================================================================
; Efootball Sider by Toriga - Master Configuration (sider.ini)
; ==============================================================================

[SETTINGS]
mods_directory = "content"
live_asset_loader = 1
live_texture_override = 1
live_mesh_override = 1
live_database_override = 1

[sider]
debug = 1
freecam = 0

[camera]
enabled = 1
zoom = 1.20
height = 0.95
angle = 0.10
fov = 42.0
freecam_speed = 2.5

[OVERLAY]
enabled = 1
hotkey_toggle = "Space"
hotkey_freecam = "F1"

[SERVERS]
kitserver_enabled = 1
stadiumserver_enabled = 1
ballserver_enabled = 1

[LIVE_CPK]
; Registra una root per ogni pacchetto attivo, ad esempio:
; cpk.root = "content\My_Custom_Mod"

[db_injection]
enabled = 1
xor_mask = 0x6B

[teams]
; In-Memory live team name replacement (RAM string patching for offline / exhibition mode)
; London FC = Arsenal
; MD White = Real Madrid

[players]
; In-Memory live player name replacement (61-byte fixed field boundary validation)
; Example_Player = Real_Player
