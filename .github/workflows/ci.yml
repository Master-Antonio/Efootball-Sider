name: CI Build & Automated Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build_and_test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust Toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Rust Automated Unit Tests
      run: |
        cd rust_sider
        cargo test
        cd ..

    - name: Build Native Rust Core in Release Mode (dxgi.dll & pes_crypto_cli)
      shell: cmd
      run: |
        cd rust_sider && cargo build --release && cd ..
        cd pes_crypto_cli && cargo build --release && cd ..

    - name: Run Python Automated Test Suite
      run: |
        python -m unittest discover -s tests

    - name: Build & Package Production Release Archive
      shell: cmd
      run: |
        python -c "import os, shutil, zipfile; os.makedirs('release_build', exist_ok=True); shutil.copy2(r'rust_sider\target\release\dxgi.dll', r'release_build\dxgi.dll'); shutil.copy2(r'pes_crypto_cli\target\release\pes_crypto_cli.exe', r'release_build\pes_crypto_cli.exe'); shutil.copy2('sider.ini', 'release_build'); shutil.copy2('efootball_sider_gui.py', 'release_build'); shutil.copy2('requirements.txt', 'release_build'); shutil.copy2('README.md', 'release_build'); shutil.copy2('LICENSE', 'release_build'); [shutil.copy2(f, 'release_build') for f in os.listdir('.') if f.endswith('.bat')]; (shutil.copytree('content', r'release_build\content') if os.path.exists('content') else None); zf = zipfile.ZipFile('eFootball_Sider_Release.zip', 'w', zipfile.ZIP_DEFLATED); [zf.write(os.path.join(b, f), os.path.relpath(os.path.join(b, f), 'release_build')) for b, d, fs in os.walk('release_build') for f in fs]; zf.close(); print('Release ZIP generated successfully!')"

    - name: Upload Release Artifact
      uses: actions/upload-artifact@v4
      with:
        name: eFootball_Sider_Release
        path: eFootball_Sider_Release.zip
